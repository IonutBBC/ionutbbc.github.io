<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090814">
  <meta name="description" content="Lyra & Ionuț — Our Music • Our Universe">
  <title>Lyra &amp; Ionuț — Our Music • Our Universe</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <div class="ambient ambient--violet" aria-hidden="true"></div>
    <div class="ambient ambient--blue" aria-hidden="true"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>

    <div class="speakers" id="speakers" aria-hidden="true">
      <div class="speaker speaker--left">
        <div class="speaker-cone"><span class="speaker-core"></span></div>
      </div>
      <div class="speaker speaker--right">
        <div class="speaker-cone"><span class="speaker-core"></span></div>
      </div>
      <span class="sound-wave sound-wave--one"></span>
      <span class="sound-wave sound-wave--two"></span>
    </div>

    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <h1 class="brand-name">Lyra <span>&amp;</span> Ionuț</h1>
      <p class="brand-tagline">Our Music <span aria-hidden="true">•</span> Our Universe</p>
    </header>

    <section class="playlist-section" aria-labelledby="playlist-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Colecția noastră</p>
          <h2 id="playlist-heading">Playlist <span id="song-count"></span></h2>
        </div>
        <span class="playlist-badge" aria-hidden="true">♫</span>
      </div>
      <div class="playlist-scroll" id="playlist-scroll" tabindex="0" aria-label="Lista melodiilor">
        <ol class="track-list" id="track-list"></ol>
      </div>
    </section>

    <section class="mini-player" id="mini-player" aria-label="Player muzical" aria-hidden="true">
      <div class="player-topline">
        <div class="now-playing">
          <span class="now-playing-indicator" aria-hidden="true"></span>
          <span>ACUM REDĂ</span>
        </div>
        <button class="icon-button stop-button" id="stop-button" type="button" aria-label="Oprește și închide playerul" title="Stop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"></rect></svg>
        </button>
      </div>

      <p class="player-title" id="player-title">—</p>
      <input class="seek-slider" id="seek-slider" type="range" min="0" max="1000" value="0" step="1" aria-label="Poziția în melodie">
      <div class="time-row">
        <span id="current-time">0:00</span>
        <span id="total-time">--:--</span>
      </div>

      <div class="player-controls">
        <button class="icon-button transport-button" id="previous-button" type="button" aria-label="Melodia anterioară">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6l-9 6 9 6z"></path></svg>
        </button>
        <button class="play-button" id="play-button" type="button" aria-label="Redă">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 10 6-10 6z"></path></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h3v12H8zM14 6h3v12h-3z"></path></svg>
        </button>
        <button class="icon-button transport-button" id="next-button" type="button" aria-label="Melodia următoare">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l9 6-9 6z"></path></svg>
        </button>
        <label class="volume-control" for="volume-slider">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4zM16 9a5 5 0 0 1 0 6"></path></svg>
          <input id="volume-slider" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Volum">
        </label>
      </div>
      <p class="player-status" id="player-status" role="status" aria-live="polite"></p>
    </section>

    <audio id="audio" preload="metadata"></audio>
  </main>
</body>
</html>
